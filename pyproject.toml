[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtms-v1"
version = "1.0.0"
description = "VTMS-V1 physics-based vehicle thermal-management simulation engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "tests_validation", "tests_api"]
addopts = "-q"
