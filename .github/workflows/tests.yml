name: VTMS Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run VTMS test suite
        run: python -m pytest

      - name: Install M2 Stage B acceleration dependency
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ".[accelerate]"

      - name: Run M2 Stage B acceleration equivalence tests
        if: matrix.python-version == '3.13'
        run: python -m pytest tests/test_vtms_v2_m2_stage_b_accel.py

      - name: Upload M2 Stage B tested source snapshot
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: m2-stage-b-source-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src/
            scripts/run_m2_stage_b_independent.py
            validation_configs/argonne_2012_focus_71207062_calibration.json
            validation_configs/argonne_2012_focus_71207063_holdout.json
            validation_configs/vtms_v2_m2_development_manifest.json
            validation_configs/vtms_v2_m2_numerical_execution_amendment_1.json
            validation_configs/vtms_v2_m2_numerical_execution_amendment_2.json
            validation_configs/vtms_v2_m2_numerical_execution_amendment_3.json
            pyproject.toml

      - name: Run pre-Argonne identifiability preflight
        if: matrix.python-version == '3.11'
        run: python run_identifiability_preflight.py

      - name: Run VTMS-V2 M0 synthetic identifiability preflight
        if: matrix.python-version == '3.11'
        run: python run_m0_identifiability_preflight.py

      - name: Run VTMS-V2 M1 synthetic identifiability preflight
        if: matrix.python-version == '3.11'
        run: python run_m1_identifiability_preflight.py

      - name: Run VTMS-V2 M2 synthetic identifiability preflight
        if: matrix.python-version == '3.11'
        run: python run_m2_identifiability_preflight.py

      - name: Run VTMS-V2 RAD-S0 synthetic preflight
        if: matrix.python-version == '3.11'
        run: python run_rad_s0_preflight.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install

      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint web application
        run: npm run lint

      - name: Typecheck web application
        run: npm run typecheck

      - name: Run web unit tests
        run: npm test

      - name: Build web application
        run: npm run build

  api-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production API image
        run: docker build -f Dockerfile.api -t vtms-api:ci .

      - name: Boot API container
        run: docker run -d --name vtms-api-ci -e VTMS_ENV=production -p 8000:8000 vtms-api:ci

      - name: Verify API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet 'VTMS-V1'; then
              exit 0
            fi
            sleep 1
          done
          docker logs vtms-api-ci
          exit 1

  web-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production web image
        run: docker build -f web/Dockerfile --build-arg NEXT_PUBLIC_VTMS_API_URL=http://127.0.0.1:8000 -t vtms-web:ci web

      - name: Boot web container
        run: docker run -d --name vtms-web-ci -p 3000:3000 vtms-web:ci

      - name: Verify web health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health | grep --quiet 'vtms-web'; then
              exit 0
            fi
            sleep 1
          done
          docker logs vtms-web-ci
          exit 1
